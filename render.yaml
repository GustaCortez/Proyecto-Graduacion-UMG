# Blueprint de Render (https://render.com/docs/blueprint-spec).
# Despliega la API (backend/). La base de datos vive en Neon y el frontend en
# Vercel; aqui solo se declaran las variables que la API necesita.
services:
  - type: web
    name: rrhh-jalapa-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"            # Render pone un proxy inverso delante de la API
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: JWT_SECRET
        generateValue: true   # Render genera un secreto aleatorio largo
      - key: DATABASE_URL
        sync: false           # se pega a mano: cadena de conexion de Neon
      - key: CORS_ORIGIN
        sync: false           # se pega a mano: URL publica del frontend en Vercel
      # Almacenamiento S3 compatible (Cloudflare R2, Supabase Storage, Backblaze B2, AWS S3).
      # Sin estas variables los archivos se guardan en el disco efimero de Render y se pierden al redesplegar.
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: STORAGE_S3_FORCE_PATH_STYLE
        sync: false
